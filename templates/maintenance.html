
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">

<title>Brownie AI | Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #212121;
    color: #ececec;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
    padding: 50px 30px;
    background: #292929;
    border: 1px solid #3c3833;
    border-radius: 24px;
    box-shadow: 0 20px 70px #0005;
}

.logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 25px;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #e9c08e, #a9794b);
    color: #21170f;
    font-size: 32px;
    font-weight: bold;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

h1 span {
    color: #d6a66f;
}

.description {
    color: #aaa;
    font-size: 15px;
    line-height: 1.8;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 28px;
    padding: 11px 16px;
    border: 1px solid #65513d;
    border-radius: 30px;
    background: #302a24;
    color: #e1bd94;
    font-size: 13px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #d6a66f;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.footer {
    margin-top: 30px;
    color: #777;
    font-size: 12px;
}

@media(max-width: 480px) {
    .container {
        padding: 40px 22px;
    }

    h1 {
        font-size: 27px;
    }

    .description {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">B</div>

    <h1>
        Brownie AI is <span>taking a break.</span>
    </h1>

    <p class="description">
        We're making a few improvements behind the scenes.
        <br>
        Our AI assistant will be back soon!
        <br><br>
        Thank you for your patience and support.
    </p>

    <div class="status">
        <span class="dot"></span>
        Temporarily Under Maintenance
    </div>

    <div class="footer">
        © 2026 Brownie AI. All rights reserved.
    </div>

</div>

</body>
</html>

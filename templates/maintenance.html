
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5f5">
  <meta name="description" content="ROSE AI is temporarily under maintenance. Please check back soon.">
  <title>ROSE AI | Maintenance</title>
  <style>
    :root {
      color-scheme: light;
      --page: #fff5f5;
      --page-glow: #fed7d7;
      --surface: #ffffff;
      --text: #1a202c;
      --muted: #4a5568;
      --subtle: #718096;
      --accent: #e53e3e;
      --accent-soft: #fff5f5;
      --border: #fed7d7;
      --shadow: 0 18px 55px rgba(151,65,78,.12);
      font-family: 'Segoe UI',Arial,sans-serif;
    }
    body.dark-theme {
      color-scheme: dark;
      --page: #0f1115;
      --page-glow: #2d1c24;
      --surface: #1d1216;
      --text: #f7fafc;
      --muted: #a0aec0;
      --subtle: #718096;
      --accent: #ff8787;
      --accent-soft: rgba(255,135,135,.12);
      --border: rgba(255,135,135,.25);
      --shadow: 0 18px 55px rgba(0,0,0,.32);
    }
    * {box-sizing:border-box;margin:0;padding:0}
    body {
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--text);
      background:
        radial-gradient(ellipse at 15% 12%,var(--page-glow),transparent 42%),
        radial-gradient(ellipse at 88% 90%,var(--page-glow),transparent 38%),
        var(--page);
      font-family:'Segoe UI',Arial,sans-serif;
      transition:background .3s ease,color .3s ease;
    }
    .card {
      width:min(100%,560px);
      position:relative;
      overflow:hidden;
      text-align:center;
      padding:48px 34px 34px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface);
      box-shadow:var(--shadow);
      animation:rise-in .55s ease both;
    }
    .card::before {
      content:'';
      position:absolute;
      inset:0 0 auto;
      height:5px;
      background:linear-gradient(90deg,#e53e3e,#ff8b9b,#fed7d7);
    }
    .logo {
      width:82px;height:82px;
      margin:0 auto 22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:linear-gradient(145deg,#e53e3e,#ff758c);
      box-shadow:0 10px 24px rgba(229,62,62,.25);
    }
    .logo svg {width:59px;height:59px;display:block}
    .brand {
      color:var(--text);
      font-size:13px;
      font-weight:800;
      letter-spacing:3px;
      margin-bottom:15px;
    }
    h1 {
      font-size:clamp(27px,5vw,36px);
      line-height:1.2;
      letter-spacing:-.8px;
      margin-bottom:14px;
      font-weight:800;
    }
    h1 span {color:var(--accent)}
    .message {
      max-width:420px;
      margin:0 auto;
      color:var(--muted);
      font-size:15px;
      line-height:1.75;
    }
    .status {
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin:26px 0 22px;
      padding:10px 15px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:750;
    }
    .status-dot {
      width:8px;height:8px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 4px rgba(229,62,62,.12);
      animation:pulse 1.8s ease-in-out infinite;
    }
    .refresh-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      min-height:44px;
      padding:0 19px;
      border:0;
      border-radius:8px;
      background:#3182ce;
      color:#fff;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      transition:transform .2s ease,background .2s ease;
      box-shadow:0 4px 12px rgba(49,130,206,.18);
    }
    .refresh-btn:hover {
      background:#2b6cb0;
      transform:translateY(-1px);
    }
    .refresh-btn:focus-visible {
      outline:3px solid rgba(49,130,206,.3);
      outline-offset:3px;
    }
    .footer {
      margin-top:30px;
      padding-top:18px;
      border-top:1px solid var(--border);
      color:var(--subtle);
      font-size:11px;
      letter-spacing:.2px;
    }
    @keyframes pulse {
      0%,100% {opacity:1;transform:scale(1)}
      50% {opacity:.55;transform:scale(.82)}
    }
    @keyframes rise-in {
      from {opacity:0;transform:translateY(12px)}
      to {opacity:1;transform:translateY(0)}
    }
    @media(max-width:480px) {
      body {padding:16px}
      .card {padding:40px 22px 26px}
      .message {font-size:14px}
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-label="ROSE AI rose logo">
      <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
        <path d="M31 34c-2 9-2 17 0 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M30 47c-9-8-17-6-20-3 7 9 14 10 20 8M32 51c7-9 15-10 21-7-5 9-12 12-21 10" fill="#65a765" stroke="#4b8d55" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M32 34c-7 0-12-5-12-11 0-5 4-9 9-9 0-6 5-9 10-7 5 2 6 7 4 11 6 1 9 7 6 12-3 5-10 7-17 4Z" fill="#e53e3e"/>
        <path d="M31 29c-5-2-7-7-4-11 2-3 6-3 8 0 3-4 8-2 8 2 4 2 3 8-2 10-3 2-7 1-10-1Z" fill="#ff8b9b"/>
        <path d="M31 26c0-3 3-5 6-4 2 1 3 3 2 5-2 3-6 3-8-1Z" fill="#c92d4b"/>
        <path d="M23 18c-3-3-2-7 1-9 3-2 7-1 8 2M43 15c4-1 7 1 7 5" fill="none" stroke="#ffb0ba" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="brand">ROSE AI</div>
    <h1>We'll be back <span>soon.</span></h1>

    <p class="message">
      ROSE AI is taking a short break while we make a few improvements.
      We're working behind the scenes to make your experience even better.
      Thank you for your patience!
    </p>

    <div class="status">
      <span class="status-dot"></span>
      Temporarily under maintenance
    </div>

    <div>
      <button class="refresh-btn" type="button" onclick="window.location.reload()">
        <span aria-hidden="true">↻</span> Check again
      </button>
    </div>

    <div class="footer">ROSE AI · Thank you for waiting</div>
  </main>

  <script>
    (function applyRoseTheme() {
      try {
        const preference =
          localStorage.getItem('rose_theme_pref') || 'time-based';

        const hour = new Date().getHours();

        const dark =
          preference === 'dark' ||
          (preference === 'time-based' && (hour >= 16 || hour < 4));

        document.body.classList.toggle('dark-theme', dark);

        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0f1115' : '#fff5f5');

      } catch (error) {
        // Keep the default light theme if storage is unavailable.
      }
    })();
  </script>
</body>
</html>
